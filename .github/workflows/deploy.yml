name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege needed for the Pages deployment via OIDC.
permissions:
  contents: read
  pages: write
  id-token: write

# Let one full run finish rather than cancelling an in-progress deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      # Installs deps, runs `npm run build` — Astro plus the Pagefind postbuild —
      # and uploads dist/ as the Pages artifact.
      # Pinned to match package.json engines; the action defaults to Node 20 and
      # ignores engines, which would run CI on a different major than we require.
      - name: Build with Astro
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
