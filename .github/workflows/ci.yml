name: CI

# Guards main: nothing reaches it without passing these.
on:
  pull_request:
  push:
    branches-ignore: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # Pinned to package.json engines; the deploy workflow pins the same.
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck
        run: npm run check

      - name: Tests
        run: npm test

      # Also exercises the content integrity guard.
      - name: Build
        run: npm run build
